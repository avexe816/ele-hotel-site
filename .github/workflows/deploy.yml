name: Build & Deploy

# data/ の内容を変更して push すると、自動でサイトを再生成して公開します。
# 手動で実行したい場合は GitHub の Actions タブから "Run workflow" を押してください。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: サイトを生成
        run: python3 build.py

      - name: 公開用フォルダにまとめる
        run: |
          mkdir -p dist
          cp -r index.html grand.html privacy.html contact.html \
                _worker.js hotels zh zh-hant en ko assets dist/
          echo "--- dist ---"
          ls -1 dist
          echo "HTML pages: $(find dist -name '*.html' | wc -l)"

      - name: Cloudflare Pages へ公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ele-hotel --branch=main --commit-dirty=true
