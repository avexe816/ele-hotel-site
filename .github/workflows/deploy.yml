name: Build & Deploy

# data/ の内容を変更して push すると、自動でサイトを再生成して公開します。
# 管理画面（/admin）で保存したときも、このワークフローが動いて公開されます。
# 手動で実行したい場合は GitHub の Actions タブから "Run workflow" を押してください。

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 年が変わったら著作権表示の年を自動更新するため、毎年1月1日に再ビルドします（UTC 0:10 = JST 9:10）
  schedule:
    - cron: "10 0 1 1 *"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 管理画面の自動翻訳は簡体字までしか作りません。
      # 繁体字は OpenCC ＋ ホテル用語表のほうが精度が高いので、ここで空欄だけ埋めます。
      - name: 繁体字の空欄を埋める
        continue-on-error: true
        run: |
          pip install --quiet opencc-python-reimplemented
          python3 tools/zh_hant.py --fill-missing

      - name: サイトを生成
        run: python3 build.py

      - name: 公開用フォルダにまとめる
        run: |
          mkdir -p dist
          cp -r index.html grand.html privacy.html contact.html \
                _worker.js hotels zh zh-hant en ko assets admin dist/
          cp _headers dist/
          echo "--- dist ---"
          ls -1 dist
          echo "HTML pages: $(find dist -name '*.html' | wc -l)"

      - name: Cloudflare Pages へ公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ele-hotel --branch=main --commit-dirty=true

      # 埋めた繁体字をリポジトリに書き戻す。
      # GITHUB_TOKEN での push はワークフローを再起動しないので、ループしません。
      - name: 翻訳ライブラリの更新を書き戻す
        if: success()
        run: |
          if git diff --quiet -- data/i18n.json; then
            echo "翻訳ライブラリに変更はありません"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/i18n.json
          git commit -m "繁体字の自動変換を反映 [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
